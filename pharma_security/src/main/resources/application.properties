# ===== Serveur =====
server.port=8080

# ===== Base de données MySQL =====
# createDatabaseIfNotExist=true : la base "pharma_security" est créée automatiquement
spring.datasource.url=jdbc:mysql://localhost:3306/pharma_security?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# ADAPTEZ le mot de passe MySQL (vide par défaut sous XAMPP/WAMP)
spring.datasource.password=

# ===== JPA / Hibernate =====
# update : Hibernate crée/met à jour les tables à partir des classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
