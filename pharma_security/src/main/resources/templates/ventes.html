<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Enregistrer une vente</h1>
    <a class="btn" th:href="@{/home}">&larr; Accueil</a>

    <div class="error" th:if="${error}" th:text="${error}"></div>
    <div class="success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/ventes/vendre}" method="post">
        <select name="medicamentId" required>
            <option th:each="m : ${medicaments}" th:value="${m.id}"
                    th:text="${m.nom} + ' - ' + ${m.prix} + ' DH (stock : ' + ${m.stock} + ')'"></option>
        </select>
        <input type="number" name="quantite" min="1" value="1" required>
        <button type="submit">Vendre</button>
    </form>
</div>
</body>
</html>
